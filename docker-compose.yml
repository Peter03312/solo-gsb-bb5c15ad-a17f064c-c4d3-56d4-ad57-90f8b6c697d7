services:
  db:
    image: postgres:16-alpine
    container_name: speed_restriction_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-speed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-speed}
      POSTGRES_DB: ${POSTGRES_DB:-speed_restriction}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-speed} -d ${POSTGRES_DB:-speed_restriction}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: speed_restriction_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-speed}:${POSTGRES_PASSWORD:-speed}@db:5432/${POSTGRES_DB:-speed_restriction}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-speed}
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
